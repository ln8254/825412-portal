    <circle cx="195" cy="270" r="50" fill="none" stroke="url(#neonGrad)" stroke-width="22" stroke-linecap="round" />
    <path d="M 275 140 C 275 140 345 130 345 185 C 345 230 275 285 275 320 L 355 320" 
